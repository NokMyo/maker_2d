name: Release v0.0.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v0.0.1.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.0.1 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1
          name: "Tsuramechoki v0.0.1"
          target_commitish: main
          prerelease: true
          generate_release_notes: false
          body: |
            # Tsuramechoki v0.0.1

            츠라메쵸키의 첫 공개 프리뷰 릴리스입니다.

            **100% x86-64 Assembly**로 작성된 2D 횡스크롤 액션 RPG 제작툴의 초기 MVP입니다.

            ## Editor
            - Win32 네이티브 에디터
            - 발판 생성/선택/이동/삭제
            - 플레이어 시작점, 몬스터, NPC, 포탈 배치
            - 가로 맵 카메라 이동
            - project.tsrp 저장/불러오기
            - F5 테스트 플레이 실행

            ## Runtime
            - 좌우 이동 / 점프 / 중력 / 발판 충돌
            - 카메라 추적
            - 근접 공격
            - 기본 몬스터 추적 AI
            - HP / 피격 / 부활
            - NPC 대화 / 포탈 상호작용

            ## Important
            - 이번 0.0.1은 초기 소스 프리뷰입니다.
            - Windows x64 / NASM을 대상으로 설계되었습니다.
            - 현재 실행 파일은 릴리스 자산에 포함하지 않습니다.
            - 실제 Windows 빌드 및 실행 검증은 아직 완료되지 않았습니다.

            소스 코드는 GitHub가 자동으로 제공하는 Source code(zip/tar.gz)에서 받을 수 있습니다.
