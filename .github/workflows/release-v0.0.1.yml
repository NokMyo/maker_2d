name: Release v0.0.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v0.0.1.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.0.1 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1
          name: "Tsuramechoki v0.0.1"
          target_commitish: main
          prerelease: true
          generate_release_notes: false
          body: |
            # Tsuramechoki v0.0.1

            츠라메쵸키의 첫 공개 프리뷰 릴리스입니다.

            **100% x86-64 Assembly**로 작성된 2D 횡스크롤 액션 RPG 제작툴의 초기 MVP입니다.

            ## Editor
            - Win32 네이티브 에디터
            - 발판 생성/선택/이동/삭제
            - 플레이어 시작점, 몬스터, NPC, 포탈 배치
            - 가로 맵 카메라 이동
            - project.tsrp 저장/불러오기
            - F5 테스트 플레이 실행

            ## Runtime
            - 좌우 이동 / 점프 / 중력 / 발판 충돌
            - 카메라 추적
            - 근접 공격
            - 기본 몬스터 추적 AI
            - HP / 피격 / 부활
            - NPC 대화 / 포탈 상호작용

            ## Windows x64 binaries
            - `Tsuramechoki.exe` — 에디터
            - `TsuramechokiRuntime.exe` — 테스트 플레이 런타임
            - `Tsuramechoki-v0.0.1-windows-x64.zip` — 두 실행 파일 묶음

            GitHub Actions의 Windows x64 환경에서 NASM 조립과 MSVC 링크를 통과한 프리뷰 빌드입니다.
