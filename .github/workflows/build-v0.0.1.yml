name: Build v0.0.1 Windows binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-v0.0.1.yml"
      - "src/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NASM
        shell: powershell
        run: choco install nasm -y

      - name: Build editor
        shell: cmd
        run: |
          nasm -f win64 -Isrc/ src\editor.asm -o editor.obj
          link /entry:mainCRTStartup /subsystem:windows /machine:x64 /LARGEADDRESSAWARE:NO editor.obj user32.lib gdi32.lib kernel32.lib comdlg32.lib shell32.lib gdiplus.lib /out:Tsuramechoki.exe

      - name: Build runtime
        shell: cmd
        run: |
          nasm -f win64 -Isrc/ src\runtime.asm -o runtime.obj
          link /entry:mainCRTStartup /subsystem:windows /machine:x64 /LARGEADDRESSAWARE:NO runtime.obj user32.lib gdi32.lib kernel32.lib gdiplus.lib winmm.lib /out:TsuramechokiRuntime.exe

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item Tsuramechoki.exe dist\Tsuramechoki.exe
          Copy-Item TsuramechokiRuntime.exe dist\TsuramechokiRuntime.exe
          Compress-Archive -Path dist\* -DestinationPath Tsuramechoki-v0.0.1-windows-x64.zip -Force

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tsuramechoki-windows-x64
          path: |
            dist/Tsuramechoki.exe
            dist/TsuramechokiRuntime.exe
            Tsuramechoki-v0.0.1-windows-x64.zip
          if-no-files-found: error
